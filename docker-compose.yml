services:

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment: ["GF_SECURITY_ADMIN_PASSWORD=admin"]
    restart: unless-stopped


volumes:
  mlruns:           # MLflow DB + artifacts — shared between mlflow and app
  prometheus_data:  # Prometheus TSDB — survives container restarts
  grafana_data: 